<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦞 Lobster-Tracer · 可视化调试面板 (D5/D6)</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #FFF8F2 0%, #C8E6E2 100%);
      min-height: 100vh; padding: 20px; color: #2A2A2A;
    }
    a { color: #FF6878; text-decoration: none; }
    .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .header h1 { font-size: 24px; background: linear-gradient(90deg, #FF8B94, #FFD9C0);
                 -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header .nav a { margin-left: 14px; font-size: 13px; font-weight: 600; }
    .top { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
    .panel { background: rgba(255,255,255,0.85); border-radius: 12px; padding: 16px;
             border: 1px solid rgba(0,0,0,0.05); backdrop-filter: blur(10px); }
    .panel h2 { font-size: 15px; margin-bottom: 10px; color: #2A2A2A; }
    .chart { width: 100%; height: 320px; }
    .mid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
    .agg { margin-bottom: 16px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 14px; }
    .kpi { background: rgba(255,255,255,0.6); border-radius: 10px; padding: 12px; text-align: center; }
    .kpi .k { font-size: 11px; color: #999; letter-spacing: 1px; }
    .kpi .v { font-size: 20px; font-weight: 800; color: #FF8B94; margin-top: 4px; }
    .agg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .sess-list { max-height: 520px; overflow-y: auto; }
    .sess { padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer;
            background: rgba(255,255,255,0.6); border: 1px solid transparent; transition: .15s; }
    .sess:hover { border-color: #FF8B94; }
    .sess.active { border-color: #FF8B94; background: #FFE9EC; }
    .sess .row1 { display: flex; justify-content: space-between; font-size: 12px; }
    .sess .model { font-weight: 700; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .st-completed { background: #4CAF93; } .st-running { background: #FFB74D; } .st-failed { background: #E57373; }
    .sess .meta { font-size: 11px; color: #888; margin-top: 4px; }
    .detail .meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .mg { background: rgba(255,255,255,0.6); border-radius: 8px; padding: 8px 10px; }
    .mg .k { font-size: 10px; color: #999; letter-spacing: 1px; }
    .mg .v { font-size: 15px; font-weight: 700; color: #FF8B94; margin-top: 2px; }
    .log { max-height: 320px; overflow-y: auto; font-family: 'Menlo','Monaco',monospace; font-size: 12px;
           background: #1A1A1A; color: #E0E0E0; border-radius: 8px; padding: 12px; white-space: pre-wrap; line-height: 1.5; }
    .log .reason { color: #FFD9C0; }
    .log .content { color: #C8E6E2; }
    .empty { color: #999; font-size: 13px; padding: 20px; text-align: center; }
    .toolbar { margin-bottom: 10px; }
    button { padding: 6px 14px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600;
             cursor: pointer; background: #FF8B94; color: #fff; }
    button:hover { background: #FF6878; }
    button.ghost { background: rgba(0,0,0,0.06); color: #666; }
    button.ghost:hover { background: rgba(0,0,0,0.12); }
    .badge { font-size: 10px; padding: 2px 9px; border-radius: 10px; font-weight: 700; vertical-align: middle; margin-left: 6px; }
    .badge.real { background: #4CAF93; color: #fff; }
    .badge.reference { background: #FFB74D; color: #fff; }
    .live { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #999; margin-right: 4px; }
    .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #ccc; transition: .2s; }
    .live.on .live-dot { background: #4CAF93; box-shadow: 0 0 8px #4CAF93; }
    .live.pulse .live-dot { background: #FF8B94; box-shadow: 0 0 8px #FF8B94; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🦞 Lobster-Tracer · 可视化调试面板</h1>
    <div class="nav">
      <span id="liveWrap" class="live"><span class="live-dot"></span><span id="liveText">连接中…</span></span>
      <a href="/">首页</a>
      <a href="/playground.html">Playground</a>
      <a href="https://lobster-tracer-production.up.railway.app" target="_blank">公网</a>
    </div>
  </div>

  <div class="top">
    <div class="panel">
      <h2>状态机迁移 <span id="srcBadge" class="badge reference">示例</span></h2>
      <div class="toolbar">
        <button onclick="seedDemo()">⚡ 注入示例工作流</button>
        <button class="ghost" onclick="resetTransitions()">清空</button>
      </div>
      <div id="sankey" class="chart"></div>
    </div>
    <div class="panel">
      <h2>会话状态分布</h2>
      <div id="statusPie" class="chart"></div>
    </div>
  </div>

  <div class="agg">
    <div class="panel">
      <h2>📊 多会话聚合 <span class="badge reference">Fleet 可观测性</span></h2>
      <div class="toolbar"><button class="ghost" onclick="loadAggregate()">↻ 刷新聚合</button></div>
      <div class="kpis" id="aggKpis"><div class="empty">加载中…</div></div>
      <div class="agg-grid">
        <div class="panel"><h2>各模型 token 消耗 (prompt/completion)</h2><div id="modelChart" class="chart" style="height:300px"></div></div>
        <div class="panel"><h2>各 phase 自环次数 <span style="font-size:11px;color:#E57373">(长任务卡死信号)</span></h2><div id="loopChart" class="chart" style="height:300px"></div></div>
      </div>
      <div class="panel" style="margin-top:16px"><h2>Top 会话 token 排行</h2><div id="topChart" class="chart" style="height:280px"></div></div>
    </div>
  </div>

  <div class="mid">
    <div class="panel sess-list" id="sessList">
      <div class="toolbar"><button onclick="loadSessions()">↻ 刷新会话</button></div>
      <div class="empty">加载中…</div>
    </div>
    <div class="panel detail" id="detail">
      <div class="empty">← 从左侧选择一个会话查看 token 流 / chunk 时间线</div>
    </div>
  </div>

<script>
const sankey = echarts.init(document.getElementById('sankey'));
const statusPie = echarts.init(document.getElementById('statusPie'));
const modelChart = echarts.init(document.getElementById('modelChart'));
const loopChart = echarts.init(document.getElementById('loopChart'));
const topChart = echarts.init(document.getElementById('topChart'));
window.addEventListener('resize', () => { sankey.resize(); statusPie.resize(); modelChart.resize(); loopChart.resize(); topChart.resize(); });

// D8: WebSocket 实时推送 —— 落库即推,面板无需轮询
let currentSessionId = null;
let ws, liveTimer;
// [AUDIT #2/P0] 从 URL ?token= 取鉴权 token(启用 ADMIN_TOKEN 后,REST 与 WS 共用同一 token)
const _wt = new URLSearchParams(location.search).get('token');
function authed(opts = {}) {
  if (_wt) opts.headers = { ...(opts.headers || {}), 'Authorization': 'Bearer ' + _wt };
  return opts;
}
function connectWS() {
  const live = document.getElementById('liveWrap');
  const _wsUrl = `ws://${location.host}${_wt ? `?token=${encodeURIComponent(_wt)}` : ''}`;
  try { ws = new WebSocket(_wsUrl); } catch { return; }
  ws.onopen = () => { live.className = 'live on'; document.getElementById('liveText').textContent = '实时'; };
  ws.onclose = () => { live.className = 'live'; document.getElementById('liveText').textContent = '已断开·重连中'; setTimeout(connectWS, 2000); };
  ws.onerror = () => { live.className = 'live'; };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'connected') return;
    if (m.type === 'event') {
      live.className = 'live pulse'; clearTimeout(liveTimer);
      liveTimer = setTimeout(() => live.className = 'live on', 200);
      // 当前打开的会话收到 chunk → 即时追加到日志(真正"正在发生"的现场感)
      const p = m.payload || {};
      if (p.sessionId === currentSessionId && p.eventType === 'chunk') appendLiveChunk(p.payload);
    }
  };
}
function appendLiveChunk(p) {
  const logEl = document.querySelector('#detail .log');
  if (!logEl) return;
  const c = p?.content_delta ? `<span class="content">${escapeHtml(p.content_delta)}</span>` : '';
  const r = p?.reasoning_delta ? `<span class="reason">[R] ${escapeHtml(p.reasoning_delta)}</span>` : '';
  logEl.innerHTML += `#${p?.idx ?? '?'} ${c}${r}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

async function loadStateMachine() {
  try {
    const m = await (await fetch('/analytics/statemachine')).json();
    const badge = document.getElementById('srcBadge');
    if (m.source === 'real') { badge.textContent = '真实迁移数据'; badge.className = 'badge real'; }
    else { badge.textContent = '示例状态机(暂无真实数据)'; badge.className = 'badge reference'; }
    const data = m.transitions.map(t => ({ source: t.from, target: t.to, value: t.value, reasons: t.reasons || '' }));
    sankey.setOption({
      tooltip: { trigger: 'item', formatter: p => {
        if (p.dataType !== 'edge') return p.name;
        let s = `${p.data.source} → ${p.data.target}<br/>次数: ${p.data.value}`;
        if (p.data.reasons) s += `<br/>原因: ${p.data.reasons.split(',').slice(0,3).join(' / ')}`;
        return s;
      } },
      series: [{
        type: 'sankey', emphasis: { focus: 'adjacency' },
        nodeAlign: 'left',
        data: m.phases.map(p => ({ name: p, itemStyle: { color: p === 'error' ? '#E57373' : p === 'done' ? '#4CAF93' : '#FF8B94' } })),
        links: data,
        label: { color: '#2A2A2A', fontSize: 11 },
        lineStyle: { color: 'gradient', opacity: 0.45, curveness: 0.5 }
      }]
    });
  } catch (e) { console.error(e); }
}

// D7: 注入示例工作流 → 让 Sankey 立刻显示真实迁移数据
async function seedDemo() {
  await fetch('/analytics/seed', authed({ method: 'POST' }));
  loadStateMachine();
}
// D7: 清空真实迁移数据
async function resetTransitions() {
  if (!confirm('清空所有真实状态机迁移数据?')) return;
  await fetch('/analytics/transitions', authed({ method: 'DELETE' }));
  loadStateMachine();
}

async function loadStatus() {
  try {
    const h = await (await fetch('/health')).json();
    const s = h.db_stats || {};
    statusPie.setOption({
      tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
      series: [{
        type: 'pie', radius: ['45%', '70%'],
        label: { fontSize: 12 },
        data: [
          { name: 'completed', value: s.completed || 0, itemStyle: { color: '#4CAF93' } },
          { name: 'running', value: s.running || 0, itemStyle: { color: '#FFB74D' } },
          { name: 'failed', value: s.failed || 0, itemStyle: { color: '#E57373' } }
        ]
      }]
    });
  } catch (e) { console.error(e); }
}

async function loadSessions() {
  const box = document.getElementById('sessList');
  try {
    const { sessions } = await (await fetch('/sessions?limit=100')).json();
    if (!sessions.length) { box.innerHTML = '<div class="empty">暂无会话,去 Playground 跑一次</div>'; return; }
    box.innerHTML = '<div class="toolbar"><button onclick="loadSessions()">↻ 刷新会话</button></div>' +
      sessions.map(s => `
        <div class="sess" onclick="openSession('${escapeHtml(s.id)}', this)">
          <div class="row1">
            <span class="model">${escapeHtml(s.model || 'unknown')}</span>
            <span><span class="dot st-${escapeHtml(s.status || 'unknown')}"></span>${escapeHtml(s.status || 'unknown')}</span>
          </div>
          <div class="meta">${escapeHtml(s.phase || '—')} · ${escapeHtml((s.id || '').slice(0,8))} · ${escapeHtml(s.started_at?.slice(0,19)?.replace('T',' ') || '')}</div>
        </div>`).join('');
  } catch (e) { box.innerHTML = '<div class="empty">加载失败</div>'; }
}

async function openSession(id, el) {
  document.querySelectorAll('.sess').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');
  currentSessionId = id; // D8: 标记当前会话,WS 实时追加只针对它
  const detail = document.getElementById('detail');
  detail.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const { session, events } = await (await fetch('/sessions/' + id, authed())).json();
    const chunks = events.filter(e => e.event_type === 'chunk' && e.payload);
    // 累计 content / reasoning 字符流(代理 token 流)
    let cC = 0, cR = 0; const xs = [], yC = [], yR = [];
    chunks.forEach(e => {
      cC += (e.payload.content_delta || '').length;
      cR += (e.payload.reasoning_delta || '').length;
      xs.push(e.payload.idx); yC.push(cC); yR.push(cR);
    });

    detail.innerHTML = `
      <div class="meta-grid">
        <div class="mg"><div class="k">MODEL</div><div class="v">${session.model || '—'}</div></div>
        <div class="mg"><div class="k">PHASE</div><div class="v">${session.phase || '—'}</div></div>
        <div class="mg"><div class="k">COMPLETION TOK</div><div class="v">${session.completion_tokens || 0}</div></div>
        <div class="mg"><div class="k">DURATION</div><div class="v">${((session.duration_ms||0)/1000).toFixed(1)}s</div></div>
      </div>
      <h2>字符流时间线 (content vs reasoning)</h2>
      <div id="flow" class="chart" style="height:240px"></div>
      <h2 style="margin-top:12px">Chunk 事件日志 (${chunks.length})</h2>
      <div class="log">${renderLog(chunks)}</div>`;

    const flow = echarts.init(document.getElementById('flow'));
    flow.setOption({
      tooltip: { trigger: 'axis' }, legend: { data: ['content', 'reasoning'], top: 0 },
      grid: { left: 40, right: 16, top: 30, bottom: 24 },
      xAxis: { type: 'category', data: xs, name: 'chunk' },
      yAxis: { type: 'value', name: '累计字符' },
      series: [
        { name: 'content', type: 'line', showSymbol: false, data: yC, lineStyle: { color: '#4CAF93' }, itemStyle: { color: '#4CAF93' } },
        { name: 'reasoning', type: 'line', showSymbol: false, data: yR, lineStyle: { color: '#FFB74D' }, itemStyle: { color: '#FFB74D' } }
      ]
    });
  } catch (e) { detail.innerHTML = '<div class="empty">加载失败</div>'; }
}

function renderLog(chunks) {
  return chunks.slice(-200).map(e => {
    const p = e.payload || {};
    const c = p.content_delta ? `<span class="content">${escapeHtml(p.content_delta)}</span>` : '';
    const r = p.reasoning_delta ? `<span class="reason">[R] ${escapeHtml(p.reasoning_delta)}</span>` : '';
    return `#${p.idx} ${c}${r}`;
  }).join('\n') || '(无 chunk 事件)';
}
function escapeHtml(s) {
  // hotfix(D8.1): 全转义所有 HTML 特殊字符(含 " '),防止在属性/事件处理器上下文注入 payload
  return (s == null ? '' : String(s))
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// D10: 多会话聚合面板(Fleet 可观测性)
async function loadAggregate() {
  try {
    const a = await (await fetch('/analytics/aggregate')).json();
    const b = a.base || {};
    const total = b.total || 0;
    const failRate = total ? ((b.failed || 0) / total * 100).toFixed(1) : '0.0';
    const totalTok = (b.total_prompt || 0) + (b.total_completion || 0);
    const avgDur = ((b.avg_duration_ms || 0) / 1000).toFixed(1);

    document.getElementById('aggKpis').innerHTML = total
      ? `<div class="kpi"><div class="k">总会话</div><div class="v">${total}</div></div>
         <div class="kpi"><div class="k">失败率</div><div class="v">${failRate}%</div></div>
         <div class="kpi"><div class="k">总 token</div><div class="v">${totalTok}</div></div>
         <div class="kpi"><div class="k">平均耗时</div><div class="v">${avgDur}s</div></div>`
      : '<div class="empty">暂无会话,去 Playground 跑一次</div>';

    // 各模型 token 消耗(堆叠)
    const models = a.byModel || [];
    modelChart.setOption({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      legend: { data: ['prompt', 'completion'], top: 0 },
      grid: { left: 56, right: 16, top: 30, bottom: 70 },
      xAxis: { type: 'category', data: models.map(m => m.model), axisLabel: { rotate: 30, fontSize: 10 } },
      yAxis: { type: 'value', name: 'token' },
      series: [
        { name: 'prompt', type: 'bar', stack: 't', data: models.map(m => m.prompt), itemStyle: { color: '#FFB74D' } },
        { name: 'completion', type: 'bar', stack: 't', data: models.map(m => m.completion), itemStyle: { color: '#4CAF93' } }
      ]
    });

    // 各 phase 自环次数(长任务卡死信号)
    const loops = a.selfLoopByPhase || [];
    loopChart.setOption({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: p => `${escapeHtml(p[0].name)}<br/>自环次数: ${p[0].value}` },
      grid: { left: 48, right: 16, top: 20, bottom: 70 },
      xAxis: { type: 'category', data: loops.map(l => l.phase), axisLabel: { rotate: 30, fontSize: 10 } },
      yAxis: { type: 'value', name: '自环' },
      series: [{ type: 'bar', data: loops.map(l => l.n), itemStyle: { color: '#E57373' } }]
    });

    // Top 会话 token 排行(横向)
    const top = a.topSessions || [];
    topChart.setOption({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: p => {
        const t = top[p[0].dataIndex];
        return `#${escapeHtml(t.id8)} · ${escapeHtml(t.model || '?')}<br/>${escapeHtml(t.phase || '-')} · ${escapeHtml(t.status)}<br/>token: ${t.total_tokens} · ${t.duration_s}s`;
      } },
      grid: { left: 60, right: 16, top: 20, bottom: 30 },
      xAxis: { type: 'value', name: 'token' },
      yAxis: { type: 'category', data: top.map(t => '#' + t.id8).reverse(), inverse: true },
      series: [{ type: 'bar', data: top.map(t => t.total_tokens).reverse(), itemStyle: { color: '#FF8B94' } }]
    });
  } catch (e) { console.error(e); }
}

loadStateMachine(); loadStatus(); loadSessions(); loadAggregate(); connectWS();
</script>
</body>
</html>
